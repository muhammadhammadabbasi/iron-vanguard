name: Generate voices

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/voice/lines.json"
      - "tools/voice/make_voices.py"

permissions:
  contents: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Piper TTS and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts

      - name: Generate voice lines
        run: python tools/voice/make_voices.py

      - name: Commit voices
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add -A assets/voice tools/voice/manifest.json
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Generate voice lines"
            git pull --rebase
            git push
          fi
